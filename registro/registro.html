<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - WalletFlow</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="registro.css">
</head>
<body class="bg-light">
  <div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm w-100" style="max-width:600px;">
      <div class="card-body p-4">
        
        <div class="text-center mb-4">
            <img src="Logo_Wallet_Flow-removebg-preview.png" alt="Logo WalletFlow" style="height: 100px;" class="mb-2">
            <h1 class="h4 text-success">WalletFlow</h1>
          </div>
          
        
        <div class="progress mb-4">
          <div id="formProgress" class="progress-bar bg-success" role="progressbar" style="width: 50%;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        
        <form id="multiStepForm" novalidate>
          <!-- Paso 1 -->
          <div class="form-step">
            <h2 class="h5 mb-3">Información personal</h2>
            <div class="mb-3 form-group">
              <label for="reg-email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="reg-email" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3 form-group">
              <label for="reg-id" class="form-label">Número de Identificación</label>
              <input type="text" class="form-control" id="reg-id" placeholder="Ingresa tu ID" required>
            </div>
            <div class="row">
              <div class="col mb-3 form-group">
                <label for="reg-name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="reg-name" placeholder="Tu nombre" required>
              </div>
              <div class="col mb-3 form-group">
                <label for="reg-lastname" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="reg-lastname" placeholder="Tu apellido" required>
              </div>
            </div>
            <div class="mb-3 form-group">
              <label for="reg-birthdate" class="form-label">Fecha de Nacimiento</label>
              <input type="date" class="form-control" id="reg-birthdate" required>
            </div>
            <button type="button" class="btn btn-success w-100 next-step">Siguiente</button>
          </div>
          
          <!-- Paso 2 -->
          <div class="form-step d-none">
            <h2 class="h5 mb-3">Datos de la cuenta</h2>
            <div class="mb-3 form-group">
              <label for="reg-username" class="form-label">Nombre de Usuario</label>
              <input type="text" class="form-control" id="reg-username" placeholder="Elige un nombre de usuario" required>
            </div>
            <div class="mb-3 form-group">
              <label for="reg-phone" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="reg-phone" placeholder="Tu número de teléfono" required>
            </div>
            <div class="mb-3 form-group">
              <label for="reg-password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 12 caracteres" required>
              <div class="form-text password-requirements text-muted">
                Debe tener: al menos 12 caracteres, 1 mayúscula, 1 número y 1 símbolo.
              </div>
            </div>
            <div class="mb-3 form-group">
              <label for="reg-confirm-password" class="form-label">Confirmar Contraseña</label>
              <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repite tu contraseña" required>
            </div>
            <div class="d-flex justify-content-between">
              <button type="button" class="btn btn-secondary prev-step">Anterior</button>
              <button type="submit" class="btn btn-success">Registrarse</button>
            </div>
            <div class="text-center mt-3">
              <a href="#" id="back-to-login" class="text-success">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
          </div>
        </form>
        
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Custom JS -->
  <script src="registro.js"></script>
</body>
</html>
