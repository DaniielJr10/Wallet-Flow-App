<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Deuda - Debt Flow</title>
  <link rel="stylesheet" href="deudas.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
  <div class="modal-overlay" id="modalAgregar" style="display: flex;">
    <div class="modal-form">
      <form id="formAgregar">
        <h2>Agregar Deuda</h2>
        
        <div class="form-step" id="step1">
          <label>Tipo de Deuda</label>
          <select id="addTipoDeuda" required>
            <option value="tarjeta_credito">Tarjeta de Crédito</option>
            <option value="prestamo_personal">Préstamo Personal</option>
            <option value="hipoteca">Hipoteca</option>
            <option value="prestamo_vehiculo">Préstamo Vehículo</option>
            <option value="prestamo_estudiantil">Préstamo Estudiantil</option>
            <option value="otro">Otro</option>
          </select>
          
          <label>Acreedor</label>
          <select id="addAcreedor" required>
            <option value="bancolombia">Bancolombia</option>
            <option value="davivienda">Davivienda</option>
            <option value="banco_bogota">Banco de Bogotá</option>
            <option value="bbva">BBVA</option>
            <option value="scotiabank">Scotiabank</option>
            <option value="particular">Particular</option>
            <option value="otro">Otro</option>
          </select>
          
          <label>Monto Total</label>
          <input type="number" id="addMonto" required placeholder="Valor total de la deuda">
          
          <label>Fecha de Vencimiento</label>
          <input type="date" id="addFechaVencimiento" required>

          <div class="siguiente-container">
            <button type="button" class="nav-btn next-step-btn" aria-label="Siguiente">➡️</button>
          </div>
        </div>

        <div class="form-step hidden" id="step2">
          <label for="addDescripcion">Descripción</label>
          <textarea id="addDescripcion" name="descripcion" placeholder="Detalles adicionales de la deuda"></textarea>
          
          <label>Cuota Mensual</label>
          <input type="number" id="addCuotaMensual" placeholder="Valor de la cuota mensual">
          
          <div class="checkbox-options">
            <div class="checkbox-item">
              <label class="checkbox-label">
                Pago Recurrente
                <input type="checkbox" id="addCheckRecurrente" onchange="toggleFrecuencia()">
              </label>
              <div class="frecuencia-options" id="addFrecuenciaOptions">
                <select id="addFrecuencia">
                  <option value="">Seleccionar frecuencia</option>
                  <option value="semanal">Semanal</option>
                  <option value="quincenal">Quincenal</option>
                  <option value="mensual">Mensual</option>
                  <option value="bimestral">Bimestral</option>
                </select>
              </div>
            </div>
            
            <div class="checkbox-item">
              <label class="checkbox-label">
                Estado de Pago
                <input type="checkbox" id="addCheckEstado" onchange="toggleEstado()">
              </label>
              <div class="frecuencia-options" id="addEstadoOptions">
                <select id="addEstado">
                  <option value="">Seleccionar estado</option>
                  <option value="al_dia">Al día</option>
                  <option value="atrasado">Atrasado</option>
                  <option value="en_mora">En mora</option>
                  <option value="pagado">Pagado</option>
                </select>
              </div>
            </div>

            <div class="checkbox-item">
              <label class="checkbox-label">
                Prioridad
                <input type="checkbox" id="addCheckPrioridad" onchange="togglePrioridad()">
              </label>
              <div class="frecuencia-options" id="addPrioridadOptions">
                <select id="addPrioridad">
                  <option value="">Seleccionar prioridad</option>
                  <option value="alta">Alta</option>
                  <option value="media">Media</option>
                  <option value="baja">Baja</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="botones">
            <button type="submit" id="guardar">Guardar</button>
            <button type="button" onclick="cerrarModal()">Cancelar</button>
            <button type="reset">Limpiar</button>
          </div>
          <div class="flecha-container">
            <button type="button" class="nav-btn prev-step-btn" aria-label="Anterior">⬅️</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script src="deudas.js"></script>
</body>
</html>
