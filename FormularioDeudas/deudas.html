<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Deuda - Wallet Flow</title>
  <link rel="stylesheet" href="deudas.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
  <div class="modal-overlay" id="modalAgregar" style="display: flex;">
    <div class="modal-form">
      <form id="formAgregar">
        <h2>Agregar Deuda</h2>
        
        <div class="form-step" id="step1">
          <label>Tipo de Deuda</label>
          <select id="addCategoria" required>
            <option value="tarjeta_credito">Tarjeta de Crédito</option>
            <option value="prestamo_personal">Préstamo Personal</option>
            <option value="prestamo_hipotecario">Préstamo Hipotecario</option>
            <option value="prestamo_vehicular">Préstamo Vehicular</option>
            <option value="credito_educativo">Crédito Educativo</option>
            <option value="deuda_familiar">Deuda Familiar/Amigos</option>
            <option value="servicios_publicos">Servicios Públicos</option>
            <option value="otros">Otros</option>
          </select>
          
          <label>Acreedor/Entidad</label>
          <select id="addMetodo" required>
            <option value="banco_colombia">Bancolombia</option>
            <option value="banco_davivienda">Davivienda</option>
            <option value="banco_bogota">Banco de Bogotá</option>
            <option value="banco_popular">Banco Popular</option>
            <option value="cooperativa">Cooperativa</option>
            <option value="familiar_amigo">Familiar/Amigo</option>
            <option value="empresa_servicios">Empresa de Servicios</option>
            <option value="otro_acreedor">Otro</option>
          </select>
          
          <label>Monto de la Deuda</label>
          <input type="number" id="addMonto" required placeholder="Valor total de la deuda">
          
          <label>Fecha de Vencimiento</label>
          <input type="date" id="addFecha" required>

          <div class="siguiente-container">
            <button type="button" class="nav-btn next-step-btn" aria-label="Siguiente">➡️</button>
          </div>
        </div>

        <div class="form-step hidden" id="step2">
          <label for="addDescripcion">Descripción de la Deuda</label>
          <textarea id="addDescripcion" name="descripcion" placeholder="Detalles adicionales sobre la deuda..."></textarea>
          
          <div class="checkbox-options">
            <div class="checkbox-item">
              <label class="checkbox-label">
                Pago Recurrente
                <input type="checkbox" id="addCheckRecurrente" onchange="toggleFrecuencia()">
              </label>
              <div class="frecuencia-options" id="addFrecuenciaOptions">
                <select id="addFrecuencia">
                  <option value="">Seleccionar frecuencia de pago</option>
                  <option value="semanal">Semanal</option>
                  <option value="quincenal">Quincenal</option>
                  <option value="mensual">Mensual</option>
                  <option value="bimestral">Bimestral</option>
                  <option value="trimestral">Trimestral</option>
                </select>
              </div>
            </div>
            
            <div class="checkbox-item">
              <label class="checkbox-label">
                Cuenta para Pago
                <input type="checkbox" id="addCheckCuenta" onchange="toggleCuenta()">
              </label>
              <div class="frecuencia-options" id="addCuentaAsociadaOptions">
                <select id="addCuentaAsociada">
                  <option value="">Seleccionar cuenta de pago</option>
                  <option value="bancolombia">Bancolombia</option>
                  <option value="davivienda">Davivienda</option>
                  <option value="nequi">Nequi</option>
                  <option value="daviplata">Daviplata</option>
                  <option value="efectivo">Efectivo</option>
                </select>
              </div>
            </div>

            <div class="checkbox-item">
              <label class="checkbox-label">
                Tasa de Interés
                <input type="checkbox" id="addCheckInteres" onchange="toggleInteres()">
              </label>
              <div class="frecuencia-options" id="addInteresOptions">
                <input type="number" id="addTasaInteres" placeholder="% anual" step="0.01" min="0">
              </div>
            </div>
          </div>
          
          <div class="botones">
            <button type="submit" id="guardar">Guardar Deuda</button>
            <button type="button" onclick="cerrarModal()">Cancelar</button>
            <button type="reset">Limpiar</button>
          </div>
          <div class="flecha-container">
            <button type="button" class="nav-btn prev-step-btn" aria-label="Anterior">⬅️</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script src="deudas.js"></script>
</body>
</html>
