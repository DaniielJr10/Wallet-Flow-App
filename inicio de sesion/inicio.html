<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - WalletFlow</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="inicio.css">
</head>
<body class="bg-light">
  <div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm w-100" style="max-width:450px;">
      <div class="card-body p-4">
        
        <!-- Logo y título -->
        <div class="text-center mb-4">
          <img src="../registro/Logo_Wallet_Flow-removebg-preview.png" alt="Logo WalletFlow" style="height: 100px;" class="mb-2">
          <h1 class="h4 text-success mb-2">WalletFlow</h1>
          <p class="text-muted">Inicia sesión en tu cuenta</p>
        </div>
        
        <!-- Formulario de inicio de sesión -->
        <form id="loginForm" novalidate>
          
          <!-- Campo de usuario/email -->
          <div class="mb-3">
            <label for="login-identifier" class="form-label">
              <i class="bi bi-person-fill me-2"></i>Correo
            </label>
            <input type="text" class="form-control" id="login-identifier" placeholder="Ingresa tu correo" required>
            <div class="invalid-feedback">
              Por favor ingresa tu correo.
            </div>
          </div>
          
          <!-- Campo de contraseña -->
          <div class="mb-3">
            <label for="login-password" class="form-label">
              <i class="bi bi-lock-fill me-2"></i>Contraseña
            </label>
            <div class="input-group">
              <input type="password" class="form-control" id="login-password" placeholder="Ingresa tu contraseña" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                <i class="bi bi-eye" id="toggleIcon"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Por favor ingresa tu contraseña.
            </div>
          </div>
          
          <!-- Recordar usuario -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Recordar mi usuario
            </label>
          </div>
          
          <!-- Mensajes de error/éxito -->
          <div id="loginMessage" class="alert d-none" role="alert"></div>
          
          <!-- Botón de iniciar sesión -->
          <button type="submit" class="btn btn-success w-100 mb-3" id="loginBtn">
            <span class="spinner-border spinner-border-sm d-none me-2" role="status" id="loginSpinner"></span>
            Iniciar Sesión
          </button>
          
          <!-- Enlaces adicionales -->
          <div class="text-center mb-3">
            <a href="#" class="text-success text-decoration-none" id="forgotPassword">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          
          <hr class="my-3">
          
          <!-- Enlace a registro -->
          <div class="text-center">
            <a href="../registro/registro.html" class="btn btn-outline-success w-100">
              <i class="bi bi-person-plus me-2"></i>Registrarse
            </a>
          </div>
          
        </form>
        
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Custom JS -->
  <script src="inicio.js"></script>
</body>
</html>
