<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>

  <!-- Bootstrap y Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  
  <!-- Estilos -->
  <link rel="stylesheet" href="calculadora.css" />
</head>
<body>

  <!-- Botón para mostrar menú lateral en móviles -->
  <button class="btn btn-success d-md-none m-2" type="button" data-bs-toggle="collapse" data-bs-target="#menuLateral">
    <i class="bi bi-list"></i> Menú
  </button>

  <div class="container-fluid">
    <div class="row">
      <!-- Menú lateral -->
      <div id="menuLateral" class="col-md-2 collapse d-md-block menu-lateral">
        <div class="logowf d-flex align-items-center p-3">
          <img src="../../registro/Logo_Wallet_Flow-removebg-preview.png" alt="Logo" width="80" height="80">
          <h4 class="titulologo">Wallet Flow</h4>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="../../pantallaprincipal/principal.html"><i class="bi bi-house-door-fill me-2 icono-menu"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../../ingresos/ingresos.html"><i class="bi bi-cash-stack me-2 icono-menu"></i>Ingresos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart-fill me-2 icono-menu"></i>Gastos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-piggy-bank-fill me-2 icono-menu"></i>Ahorros</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-credit-card-2-back-fill me-2 icono-menu"></i>Deudas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-graph-up-arrow me-2 icono-menu"></i>Inversiones</a></li>
          <li class="nav-item"><a class="nav-link" href="../../cuentas/cuentas.html"><i class="bi bi-bank me-2 icono-menu"></i>Cuentas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bullseye me-2 icono-menu"></i>Objetivos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-lightbulb-fill me-2 icono-menu"></i>Consejos</a></li>
          <li class="nav-item"><a class="nav-link" href="../../herramientas/herramientas.html"><i class="bi bi-wrench me-2 icono-menu"></i>Herramientas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-question-circle-fill me-2 icono-menu"></i>Ayuda</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear-fill me-2 icono-menu"></i>Configuración</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2 icono-menu"></i>Cerrar sesión</a></li>
        </ul>
      </div>

      <!-- Contenido principal -->
      <div class="col-md-10 contenido-principal">
        <div class="container my-5">
          <!-- Título Principal -->
          <div class="row mb-5">
            <div class="col text-center">
              <h1 class="titulo-principal">
                <i class="bi bi-calculator-fill me-3"></i>CALCULADORA
              </h1>
              <p class="subtitulo-pagina">Herramienta de cálculo financiero avanzada</p>
            </div>
          </div>
          
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
              <div class="card shadow-lg border-0 calculadora-card">
                <div class="card-body p-4">
                  <!-- Pantalla de la calculadora -->
                  <div class="mb-4">
                    <div id="display" class="calculadora-display text-end">0</div>
                    <div class="operacion-actual text-muted text-end mt-2" id="operacionActual"></div>
                  </div>
                  
                  <!-- Botones de la calculadora -->
                  <div class="calculadora-botones">
                    <!-- Fila 1: Funciones especiales -->
                    <div class="row g-2 mb-2">
                      <div class="col-3">
                        <button class="btn btn-outline-danger btn-calculadora w-100" onclick="clearAll()">
                          <i class="bi bi-trash"></i> AC
                        </button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-warning btn-calculadora w-100" onclick="clearEntry()">
                          CE
                        </button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-warning btn-calculadora w-100" onclick="backspace()">
                          <i class="bi bi-backspace"></i>
                        </button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="operate('/')">
                          ÷
                        </button>
                      </div>
                    </div>
                    
                    <!-- Fila 2: 7, 8, 9, × -->
                    <div class="row g-2 mb-2">
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('7')">7</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('8')">8</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('9')">9</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="operate('*')">
                          <i class="bi bi-x"></i>
                        </button>
                      </div>
                    </div>
                    
                    <!-- Fila 3: 4, 5, 6, - -->
                    <div class="row g-2 mb-2">
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('4')">4</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('5')">5</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('6')">6</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="operate('-')">
                          <i class="bi bi-dash"></i>
                        </button>
                      </div>
                    </div>
                    
                    <!-- Fila 4: 1, 2, 3, + -->
                    <div class="row g-2 mb-2">
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('1')">1</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('2')">2</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('3')">3</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="operate('+')">
                          <i class="bi bi-plus"></i>
                        </button>
                      </div>
                    </div>
                    
                    <!-- Fila 5: 0, ., =, % -->
                    <div class="row g-2">
                      <div class="col-6">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendNumber('0')">0</button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-outline-dark btn-calculadora w-100" onclick="appendDecimal()">
                          .
                        </button>
                      </div>
                      <div class="col-3">
                        <button class="btn btn-success btn-calculadora w-100" onclick="calculate()">
                          =
                        </button>
                      </div>
                    </div>
                    
                    <!-- Fila adicional: Funciones financieras -->
                    <div class="row g-2 mt-3">
                      <div class="col-6">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="calculatePercentage()">
                          %
                        </button>
                      </div>
                      <div class="col-6">
                        <button class="btn btn-primary btn-calculadora w-100" onclick="squareRoot()">
                          √
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  <!-- Historial de operaciones -->
                  <div class="mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <h6 class="text-muted mb-0">
                        <i class="bi bi-clock-history me-2"></i>
                        Historial de operaciones
                      </h6>
                      <button class="btn btn-outline-danger btn-sm" onclick="clearHistory()" title="Limpiar historial">
                        <i class="bi bi-trash3"></i>
                      </button>
                    </div>
                    <div class="historial-container">
                      <ul id="historial" class="list-unstyled historial-list">
                        <!-- El historial se llenará dinámicamente -->
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="calculadora.js"></script>
</body>
</html>
