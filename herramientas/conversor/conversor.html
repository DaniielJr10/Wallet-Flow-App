<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Monedas</title>
  <!-- Bootstrap y Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../herramientas.css" />
  <link rel="stylesheet" href="conversor.css" />
</head>
<body>
  <!-- Botón para mostrar menú lateral en móviles -->
  <button class="btn btn-success d-md-none m-2" type="button" data-bs-toggle="collapse" data-bs-target="#menuLateral">
    <i class="bi bi-list"></i> Menú
  </button>
  <div class="container-fluid">
    <div class="row">
      <!-- Menú lateral -->
      <div id="menuLateral" class="col-md-2 collapse d-md-block menu-lateral">
        <div class="logowf d-flex align-items-center p-3">
          <img src="../../registro/Logo_Wallet_Flow-removebg-preview.png" alt="Logo" width="80" height="80">
          <h4 class="titulologo">Wallet Flow</h4>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="../../pantallaprincipal/principal.html"><i class="bi bi-house-door-fill me-2 icono-menu"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../../ingresos/ingresos.html"><i class="bi bi-cash-stack me-2 icono-menu"></i>Ingresos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart-fill me-2 icono-menu"></i>Gastos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-piggy-bank-fill me-2 icono-menu"></i>Ahorros</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-credit-card-2-back-fill me-2 icono-menu"></i>Deudas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-graph-up-arrow me-2 icono-menu"></i>Inversiones</a></li>
          <li class="nav-item"><a class="nav-link" href="../../cuentas/cuentas.html"><i class="bi bi-bank me-2 icono-menu"></i>Cuentas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bullseye me-2 icono-menu"></i>Objetivos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-lightbulb-fill me-2 icono-menu"></i>Consejos</a></li>
          <li class="nav-item"><a class="nav-link" href="../../herramientas/herramientas.html"><i class="bi bi-wrench me-2 icono-menu"></i>Herramientas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-question-circle-fill me-2 icono-menu"></i>Ayuda</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear-fill me-2 icono-menu"></i>Configuración</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="cerrarSesionBtn"><i class="bi bi-box-arrow-right me-2 icono-menu"></i>Cerrar sesión</a></li>
        </ul>
      </div>
      <!-- Contenido principal -->
      <div class="col-md-10 contenido-principal d-flex flex-column align-items-center justify-content-center">
        <div class="conversor-wrapper">
          <div class="text-center mb-3">
            <i class="bi bi-currency-exchange conversor-anim" style="font-size: 4rem; color: #27ae60;"></i>
          </div>
          <div class="conversor-title mb-2">Conversor de Monedas</div>
          <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" class="form-control shadow-sm" id="cantidad" placeholder="Ingresa la cantidad" min="0" />
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="monedaOrigen" class="form-label">De</label>
              <select class="form-select shadow-sm" id="monedaOrigen">
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="MXN">Peso Mexicano (MXN)</option>
                <option value="COP">Peso Colombiano (COP)</option>
                <option value="PEN">Sol Peruano (PEN)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
              </select>
            </div>
            <div class="col-6">
              <label for="monedaDestino" class="form-label">A</label>
              <select class="form-select shadow-sm" id="monedaDestino">
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="MXN">Peso Mexicano (MXN)</option>
                <option value="COP">Peso Colombiano (COP)</option>
                <option value="PEN">Sol Peruano (PEN)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
              </select>
            </div>
          </div>
          <button class="w-100 mb-3" id="convertirBtn" style="font-size:1.2rem; letter-spacing:1px;"><i class="bi bi-arrow-left-right me-2"></i>Convertir</button>
          <div id="resultado" class="alert alert-info text-center d-none"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="conversor.js"></script>
  <script src="../herramientas.js"></script>
</body>
</html>
