  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- CSS personalizado -->

</head>
<body>

  <!-- Botón para mostrar menú lateral en móviles -->
  <button class="btn btn-success d-md-none m-2" type="button" data-bs-toggle="collapse" data-bs-target="#menuLateral">
    <i class="bi bi-list"></i> Menú
  </button>

  <div class="container-fluid">
    <div class="row">
      <!-- Menú lateral -->
      <div id="menuLateral" class="col-md-2 collapse d-md-block menu-lateral">
        <div class="logowf d-flex align-items-center p-3">
          <img src="../registro/Logo_Wallet_Flow-removebg-preview.png" alt="Logo" width="80" height="80">
          <h4 class="titulologo">Wallet Flow</h4>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="../pantallaprincipal/principal.html"><i class="bi bi-house-door-fill me-2 icono-menu"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../ingresos/ingresos.html"><i class="bi bi-cash-stack me-2 icono-menu"></i>Ingresos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart-fill me-2 icono-menu"></i>Gastos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-piggy-bank-fill me-2 icono-menu"></i>Ahorros</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-credit-card-2-back-fill me-2 icono-menu"></i>Deudas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-graph-up-arrow me-2 icono-menu"></i>Inversiones</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bank me-2 icono-menu"></i>Cuentas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bullseye me-2 icono-menu"></i>Objetivos</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-lightbulb-fill me-2 icono-menu"></i>Consejos</a></li>
          <li class="nav-item"><a class="nav-link" href="../herramientas/herramientas.html"><i class="bi bi-wrench me-2 icono-menu"></i>Herramientas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-question-circle-fill me-2 icono-menu"></i>Ayuda</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear-fill me-2 icono-menu"></i>Configuración</a></li>
         <li class="nav-item"><a class="nav-link" href="#" id="cerrarSesionBtn"><i class="bi bi-box-arrow-right me-2 icono-menu"></i>Cerrar sesión</a></li>
        </ul>
      </div>

      <!-- Contenido principal -->
      <div class="col-md-10 contenido-principal">
        <div class="container my-5">
          <!-- Título Principal -->
          <div class="row mb-4">
            <div class="col text-center">
              <h1 class="titulo-principal">CUENTAS</h1>
            </div>
          </div>

          <!-- Título -->
          <h2 class="text-success mb-4">Mis Cuentas Bancarias</h2>

          <!-- Contenedor de tarjetas -->
          <div id="contenedorCuentas" class="row">
            <!-- Las tarjetas se generarán dinámicamente aquí -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para editar cuenta -->
<div id="modalAgregarCuenta" class="modal fade" tabindex="-1" aria-labelledby="modalEditarCuentaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content form-editar">
      <div class="modal-header">
        <h5 class="modal-title form-titulo" id="modalEditarCuentaLabel">Editar Cuenta</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="formAgregarCuenta">
        <div class="modal-body">
          <div class="mb-3">
            <label for="nombreCuenta" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreCuenta" required>
          </div>
          <div class="mb-3">
            <label for="tipoCuenta" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipoCuenta" required>
          </div>
          <div class="mb-3">
            <label for="numeroCuenta" class="form-label">Número</label>
            <input type="text" class="form-control" id="numeroCuenta" required>
          </div>
          <div class="mb-3">
            <label for="saldoInicial" class="form-label">Saldo Inicial</label>
            <input type="number" class="form-control" id="saldoInicial" step="0.01" required>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="cuentaPrincipal">
            <label class="form-check-label" for="cuentaPrincipal">Cuenta Principal</label>
          </div>
        </div>
        <div class="modal-footer form-buttons">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <!-- Scripts -->
  <script src="cuentas.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
