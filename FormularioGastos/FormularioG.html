<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Gasto - Wallet Flow</title>
  <link rel="stylesheet" href="FormularioG.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
  <div class="modal-overlay" id="modalAgregar" style="display: flex;">
    <div class="modal-form">
      <form id="formAgregar">
        <h2>Agregar Gasto</h2>
        
        <div class="form-step" id="step1">
  <label>Categoría</label>
  <select id="addCategoria" required>
    <option value="alimentacion">Alimentación</option>
    <option value="transporte">Transporte</option>
    <option value="servicios">Servicios</option>
    <option value="entretenimiento">Entretenimiento</option>
  </select>
  
  <label>Método de Pago</label>
  <select id="addMetodo" required>
    <option value="efectivo">Efectivo</option>
    <option value="tarjeta_credito">Tarjeta de Crédito</option>
    <option value="tarjeta_debito">Tarjeta de Débito</option>
    <option value="transferencia">Transferencia</option>
  </select>
  
  <label>Monto</label>
  <input type="number" id="addMonto" required>
  
  <label>Fecha</label>
  <input type="date" id="addFecha" required>

  <div class="siguiente-container">
    <button type="button" class="nav-btn next-step-btn" aria-label="Siguiente">➡️</button>
  </div>
</div>
        <div class="form-step hidden" id="step2">
          <label for="addDescripcion">Descripción</label>
          <textarea id="addDescripcion" name="descripcion"></textarea>
          
          <div class="checkbox-options">
            <div class="checkbox-item">
              <label class="checkbox-label">
                Gasto Recurrente
                <input type="checkbox" id="addCheckRecurrente" onchange="toggleFrecuencia()">
              </label>
              <div class="frecuencia-options" id="addFrecuenciaOptions">
                <select id="addFrecuencia">
                  <option value="">Seleccionar frecuencia</option>
                  <option value="diario">Diario</option>
                  <option value="semanal">Semanal</option>
                  <option value="mensual">Mensual</option>
                </select>
              </div>
            </div>
            
            <div class="checkbox-item">
              <label class="checkbox-label">
                Cuenta Asociada
                <input type="checkbox" id="addCheckCuenta" onchange="toggleCuenta()">
              </label>
              <div class="frecuencia-options" id="addCuentaAsociadaOptions">
                <select id="addCuentaAsociada">
                  <option value="">Seleccionar cuenta</option>
                  <option value="bancolombia">Bancolombia</option>
                  <option value="davivienda">Davivienda</option>
                  <option value="nequi">Nequi</option>
                  <option value="efectivo">Efectivo</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="botones">
            <button type="submit" id="guardar">Guardar</button>
            <button type="button" onclick="cerrarModal()">Cancelar</button>
            <button type="reset">Limpiar</button>
          </div>
          <div class="flecha-container">
            <button type="button" class="nav-btn prev-step-btn" aria-label="Anterior">⬅️</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script src="FormularioG.js"></script>
</body>
</html>
