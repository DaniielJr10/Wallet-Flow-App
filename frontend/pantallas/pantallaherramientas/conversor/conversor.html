<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Monedas</title>
  <!-- Bootstrap y Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../herramientas.css" />
  <link rel="stylesheet" href="conversor.css" />
</head>
<body>
  <!-- Botón para mostrar menú lateral en móviles -->
  <button class="btn btn-success d-md-none m-2" type="button" data-bs-toggle="collapse" data-bs-target="#menuLateral">
    <i class="bi bi-list"></i> Menú
  </button>
  <div class="container-fluid">
    <div class="row">
      <!-- Menú lateral -->
      <div id="menuLateral" class="col-md-2 collapse d-md-block menu-lateral">
        <div class="logowf d-flex align-items-center p-3">
          <img src="../../../login/registro/Logo_Wallet_Flow-removebg-preview.png" alt="Logo" width="80" height="80">
          <h4 class="titulologo">Wallet Flow</h4>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="../../pantallaprincipal/principal.html"><i class="bi bi-house-door-fill me-2 icono-menu"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallaingresos/ingresos.html"><i class="bi bi-cash-stack me-2 icono-menu"></i>Ingresos</a></li>
          <li class="nav-item"><a class="nav-link" href="../../PantallaGastos/Gastos.html"><i class="bi bi-cart-fill me-2 icono-menu"></i>Gastos</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallaahorros/ahorros.html"><i class="bi bi-piggy-bank-fill me-2 icono-menu"></i>Ahorros</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantalladeudas/deudas.html"><i class="bi bi-credit-card-2-back-fill me-2 icono-menu"></i>Deudas</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallainversiones/inversiones.html"><i class="bi bi-graph-up-arrow me-2 icono-menu"></i>Inversiones</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallacuentas/cuentas.html"><i class="bi bi-bank me-2 icono-menu"></i>Cuentas</a></li>
          <li class="nav-item"><a class="nav-link" href="../../PantallaObjetivos/PantallaObjetivo.html"><i class="bi bi-bullseye me-2 icono-menu"></i>Objetivos</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallaherramientas/herramientas.html"><i class="bi bi-wrench me-2 icono-menu"></i>Herramientas</a></li>
          <li class="nav-item"><a class="nav-link" href="../../pantallaconfiguracion/configuracion.html"><i class="bi bi-gear-fill me-2 icono-menu"></i>Configuración</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="cerrarSesionBtn"><i class="bi bi-box-arrow-right me-2 icono-menu"></i>Cerrar sesión</a></li>
        </ul>
      </div>
      <!-- Contenido principal -->
      <div class="col-md-10 contenido-principal">
        <div class="container mt-4">
          <!-- Título principal -->
          <div class="row justify-content-center mb-4">
            <div class="col-lg-8 col-md-10">
              <div class="text-center py-2">
                <i class="bi bi-currency-exchange" style="font-size: 3.2rem; background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #2ecc71;"></i>
                <h2 class="titulo-gradiente mb-2" style="font-size:2.5rem; font-family:'Inter','Segoe UI','Poppins',sans-serif; font-weight:700; background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: #2ecc71;">Conversor de Monedas</h2>
                <p class="subtitulo mb-0" style="color:#7f8c8d; font-size:1.1rem; font-weight:500; font-family:'Inter','Segoe UI','Poppins',sans-serif; margin-top:0.5rem;">Convierte entre diferentes monedas de forma rápida y sencilla</p>
              </div>
            </div>
          </div>
          
          <!-- Conversor -->
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-7 col-sm-9">
              <div class="conversor-wrapper">
                <div class="mb-3">
                  <label for="cantidad" class="form-label">Cantidad</label>
                  <input type="number" class="form-control shadow-sm" id="cantidad" placeholder="Ingresa la cantidad" min="0" />
                </div>
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="monedaOrigen" class="form-label">De</label>
                    <select class="form-select shadow-sm" id="monedaOrigen">
                      <option value="USD">Dólar (USD)</option>
                      <option value="EUR">Euro (EUR)</option>
                      <option value="MXN">Peso Mexicano (MXN)</option>
                      <option value="COP">Peso Colombiano (COP)</option>
                      <option value="PEN">Sol Peruano (PEN)</option>
                      <option value="ARS">Peso Argentino (ARS)</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label for="monedaDestino" class="form-label">A</label>
                    <select class="form-select shadow-sm" id="monedaDestino">
                      <option value="USD">Dólar (USD)</option>
                      <option value="EUR">Euro (EUR)</option>
                      <option value="MXN">Peso Mexicano (MXN)</option>
                      <option value="COP">Peso Colombiano (COP)</option>
                      <option value="PEN">Sol Peruano (PEN)</option>
                      <option value="ARS">Peso Argentino (ARS)</option>
                    </select>
                  </div>
                </div>
                <button class="w-100 mb-3" id="convertirBtn" style="font-size:1.2rem; letter-spacing:1px;"><i class="bi bi-arrow-left-right me-2"></i>Convertir</button>
                <div id="resultado" class="alert alert-info text-center d-none"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="conversor.js"></script>
  <script src="../herramientas.js"></script>
</body>
</html>
