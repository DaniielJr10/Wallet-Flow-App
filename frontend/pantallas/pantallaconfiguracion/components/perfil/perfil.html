<!-- Componente Perfil -->
<div class="tool-card" data-tool="perfil" id="perfil">
  <div class="tool-card-header">
    <div class="tool-icon-wrapper perfil-bg"><i class="bi bi-person-circle"></i></div>
    <span class="tool-badge">PERSONAL</span>
  </div>
  <div class="tool-card-body">
    <h3 class="tool-title">Mi Perfil</h3>
    <p class="tool-description">Actualiza tu información personal y foto de perfil</p>
    <div class="tool-features">
      <span class="feature-tag"><i class="bi bi-image"></i> Foto de perfil</span>
      <span class="feature-tag"><i class="bi bi-pencil"></i> Edición rápida</span>
    </div>
  </div>
  <div class="tool-card-footer">
    <button class="btn-open-tool" data-tool-target="perfil">Abrir herramienta <i class="bi bi-arrow-right-circle"></i></button>
  </div>
</div>
<div class="tool-modal" id="modal-perfil">
  <div class="tool-modal-content">
    <div class="tool-modal-header perfil-bg">
      <h2><i class="bi bi-person-circle"></i> Mi Perfil</h2>
      <button class="close-modal-btn" data-close="perfil"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="tool-modal-body">
      <div class="profile-section">
        <div class="profile-photo-display" id="profilePhotoDisplay"><i class="bi bi-person-fill"></i></div>
        <button class="btn-change-photo" id="btnChangePhoto"><i class="bi bi-camera-fill"></i> Cambiar Foto</button>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
      </div>
      <div class="form-row"><label><i class="bi bi-person"></i> Nombre Completo</label><input type="text" id="profileName" class="input-field" placeholder="Tu nombre completo"></div>
      <div class="form-row"><label><i class="bi bi-envelope"></i> Correo Electrónico</label><input type="email" id="profileEmail" class="input-field" placeholder="tu@email.com" readonly><small class="input-hint">El correo no se puede modificar</small></div>
      <div class="form-row"><label><i class="bi bi-phone"></i> Teléfono</label><input type="tel" id="profilePhone" class="input-field" placeholder="+57 300 123 4567"></div>
    </div>
    <div class="tool-modal-footer">
      <button class="btn-secondary" data-close="perfil">Cancelar</button>
      <button class="btn-save" id="btnSaveProfile"><i class="bi bi-check-circle"></i> Guardar Cambios</button>
    </div>
  </div>
</div>
