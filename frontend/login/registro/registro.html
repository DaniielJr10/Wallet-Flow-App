<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - WalletFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  
  <link rel="stylesheet" href="registro.css">
</head>
<body class="bg-light">
  <div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm w-100" style="max-width:600px;">
      <div class="card-body p-4">
        
        <div class="text-center mb-4">
            <img src="Logo_Wallet_Flow-removebg-preview.png" alt="Logo WalletFlow" style="height: 100px;" class="mb-2">
            <h1 class="h4 text-success">WalletFlow</h1>
          </div>
          
        
        <div class="progress mb-4">
          <div id="formProgress" class="progress-bar bg-success" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <form id="multiStepForm" novalidate>
          <h2 class="h5 mb-3">Registro</h2>

          <h3 class="h6">Información personal</h3>
          <div class="mb-3 form-group">
            <label for="reg-email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="reg-email" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="row">
            <div class="col mb-3 form-group">
              <label for="reg-name" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="reg-name" placeholder="Tu nombre" required>
            </div>
            <div class="col mb-3 form-group">
              <label for="reg-lastname" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="reg-lastname" placeholder="Tu apellido" required>
            </div>
          </div>

          <h3 class="h6 mt-3">Datos de la cuenta</h3>
          <div class="mb-3 form-group">
            <label for="reg-password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 6 caracteres" required>
            <div class="form-text password-requirements text-muted">
              Debe tener: al menos 6 caracteres, 1 mayúscula, 1 número y 1 símbolo.
            </div>
          </div>
          <div class="mb-3 form-group">
            <label for="reg-confirm-password" class="form-label">Confirmar Contraseña</label>
            <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repite tu contraseña" required>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="#" id="back-to-login" class="text-success">¿Ya tienes cuenta? Inicia sesión</a>
            <button type="submit" class="btn btn-success">Registrarse</button>
          </div>
        </form>
        
      </div>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <!-- Firebase SDK v9 compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat-firestore.js"></script>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  
  <!-- Firebase Configuration -->
  <script src="../../../backend/firebase/firebase-config.js"></script>
  <script src="../../../backend/firebase/firebase-autenticacion.js"></script>

  <script src="registro.js"></script>
</body>
</html>
