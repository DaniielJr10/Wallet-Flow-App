<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Ingresos</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="ingresos.css">
</head>
<body>
  <div class="container my-5">
    <!-- Título Principal -->
    <div class="row mb-4">
      <div class="col text-center">
        <h1 class="titulo-principal">INGRESOS</h1>
      </div>
    </div>

    <!-- Título -->
    <h2 class="text-success mb-4">Mis Ingresos</h2>

    <!-- Filtros -->
    <div class="row mb-4">
      <div class="col-md-4">
        <label for="mes" class="form-label">Mes:</label>
        <select class="form-select" id="mes">
          <option selected>Mayo 2025</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="categoria" class="form-label">Categoría:</label>
        <select class="form-select" id="categoria">
          <option selected>Todas</option>
        </select>
      </div>
    </div>

    <!-- Resumen -->
    <div class="row text-center">
      <div class="col-md-4 mb-3">
        <h5>Total de Ingresos</h5>
        <p class="display-6 text-success">$3200.00</p>
      </div>
      <div class="col-md-4 mb-3">
        <h5>Ingreso Principal</h5>
        <p>Trabajo</p>
      </div>
      <div class="col-md-4 mb-3">
        <h5>Comparación con Mes Anterior</h5>
        <p class="text-success">+ $200.00</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
