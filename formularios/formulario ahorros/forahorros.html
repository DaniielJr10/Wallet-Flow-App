<!-- MODAL PROFESIONAL DE AHORROS -->
<div id="modalAgregarAhorro" class="modal-overlay d-none">
  <div class="modal-form">
    <form id="formAgregarAhorro" autocomplete="off">
      <h2>Registrar Ahorro</h2>
      <!-- Sección única: Todos los campos en un solo bloque -->
      <label for="addCategoriaAhorro">Tipo de ahorro <span style="color:red">*</span></label>
      <select id="addCategoriaAhorro" required>
        <option value="">Selecciona el tipo de ahorro</option>
        <option value="meta">Meta específica</option>
        <option value="emergencia">Fondo de emergencia</option>
        <option value="inversion">Ahorro para inversión</option>
        <option value="educacion">Educación</option>
        <option value="viaje">Viaje</option>
        <option value="otro">Otro</option>
      </select>
      <label for="addMontoAhorro">Monto a ahorrar <span style="color:red">*</span></label>
      <input type="number" id="addMontoAhorro" required min="0" step="0.01" placeholder="Ej: 500000">
      <label for="addFechaAhorro">Fecha de depósito <span style="color:red">*</span></label>
      <input type="date" id="addFechaAhorro" required>
      <label for="addMetodoAhorro">¿Dónde guardarás el ahorro?</label>
      <select id="addMetodoAhorro">
        <option value="">Selecciona el método</option>
        <option value="cuenta_ahorros">Cuenta de ahorros</option>
        <option value="banco">Banco</option>
        <option value="alcancia">Alcancía</option>
        <option value="efectivo">Efectivo</option>
        <option value="otro">Otro</option>
      </select>
      <label for="addDescripcionAhorro">Descripción o propósito</label>
      <textarea id="addDescripcionAhorro" name="descripcion" placeholder="Ej: Ahorro para comprar portátil"></textarea>
  <!-- Opciones avanzadas eliminadas: ahorro recurrente y vinculación bancaria -->
      <div class="botones">
        <button type="submit" id="guardarAhorro">Guardar ahorro</button>
        <button type="button" id="cancelarAhorro">Cancelar</button>
        <button type="reset">Limpiar</button>
      </div>
    </form>
  </div>
</div>

<!-- Estilo para cambiar el color de las etiquetas a negro -->
<style>
  label {
    color: black;
  }
</style>
