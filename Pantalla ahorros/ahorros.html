<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ahorros - Wallet Flow</title>
  <link rel="stylesheet" href="ahorros.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./BarraLateral/BarraLateral.css" />
</head>
<body>

  <!-- BOTÓN HAMBURGUESA MÓVIL -->
<button id="btnMenu" class="btn btn-success d-md-none" style="position: fixed; top: 10px; left: 10px; z-index: 1200;">
  <i class="bi bi-list"></i>
</button>

  <!-- BARRA LATERAL COMPLETA -->
  <div id="menuLateral" class="menu-lateral col-md-2 collapse d-md-block">
    <div class="logowf d-flex align-items-center p-3">
      <img src="./BarraLateral/Logo_Wallet_Flow-removebg-preview.png" alt="Logo" width="80" height="80">
      <h4 class="titulologo">Wallet Flow</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-house-door-fill me-2 icono-menu"></i>Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cash-stack me-2 icono-menu"></i>Ingresos</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-cart-fill me-2 icono-menu"></i>Gastos</a></li>
      <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-piggy-bank-fill me-2 icono-menu"></i>Ahorros</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-credit-card-2-back-fill me-2 icono-menu"></i>Deudas</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-graph-up-arrow me-2 icono-menu"></i>Inversiones</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bank me-2 icono-menu"></i>Cuentas</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-bullseye me-2 icono-menu"></i>Objetivos</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-lightbulb-fill me-2 icono-menu"></i>Consejos</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-wrench me-2 icono-menu"></i>Herramientas</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-question-circle-fill me-2 icono-menu"></i>Ayuda</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear-fill me-2 icono-menu"></i>Configuración</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2 icono-menu"></i>Cerrar sesión</a></li>
    </ul>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container">
    <header>
      <h1>Ahorros</h1>
    </header>

    <!-- SUBTÍTULO Y BOTÓN -->
    <div class="seccion-superior">
      <h2>Mis Ahorros</h2>
      <button class="btn-nuevo" onclick="mostrarModal()">+ Nuevo Ahorro</button>
    </div>

    <!-- TARJETAS -->
    <section class="lista-ahorros" id="listaAhorros">
      <!-- Se agregan dinámicamente con JS -->
    </section>

    <!-- FOOTER -->
    <footer>
      <button onclick="location.href='index.html'">Volver</button>
    </footer>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalEdicion" style="display: none;">
    <div class="modal-form">
      <form id="formEditar">
        <h2>Agregar / Editar Ahorro</h2>

        <!-- Paso 1 -->
        <div class="form-step" id="step1">
          <label>Categoría</label>
          <select id="editCategoria" required>
            <option value="emergencia">Fondo de Emergencia</option>
            <option value="viajes">Viajes</option>
            <option value="educacion">Educación</option>
            <option value="otros">Otros</option>
          </select>

          <label>Título</label>
          <input type="text" id="editTitulo" placeholder="Ej: Vacaciones" required>

          <label>Monto Actual</label>
          <input type="number" id="editMonto" required>

          <label>Monto Objetivo</label>
          <input type="number" id="editObjetivo" required>

          <label>Fecha de Inicio</label>
          <input type="date" id="editFechaInicio" required>

          <label>Fecha Objetivo</label>
          <input type="date" id="editFechaObjetivo" required>

          <button type="button" class="nav-btn next-step-btn" aria-label="Siguiente">➡️</button>
        </div>

        <!-- Paso 2 -->
        <div class="form-step hidden" id="step2">
          <label>Descripción</label>
          <textarea id="editDescripcion" name="descripcion"></textarea>

          <div class="botones">
            <button type="submit">Guardar</button>
            <button type="button" onclick="cerrarModal()">Cancelar</button>
            <button type="reset">Limpiar</button>
          </div>

          <div class="flecha-container">
            <button type="button" class="nav-btn prev-step-btn" aria-label="Anterior">⬅️</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="ahorros.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
