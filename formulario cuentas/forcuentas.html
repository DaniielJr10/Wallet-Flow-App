<!-- Formulario para agregar cuenta bancaria con estilos existentes -->
<div id="modalAgregarCuenta" class="modal-overlay d-none">
    <div class="modal-form">
      <form id="formAgregarCuenta" autocomplete="off">
        <h2>Agregar Cuenta Bancaria</h2>
  
        <div class="form-step" id="cuentaStep1">
          <label for="nombreCuenta">Nombre de la Cuenta</label>
          <input type="text" id="nombreCuenta" required placeholder="Ej. Cuenta Ahorros Personal">
  
          <label for="tipoCuenta">Tipo de Cuenta</label>
          <select id="tipoCuenta" required>
            <option value="ahorros">Ahorros</option>
            <option value="corriente">Corriente</option>
            <option value="digital">Digital</option>
          </select>
  
          <label for="numeroCuenta">Número de Cuenta</label>
          <input type="text" id="numeroCuenta" required pattern="[0-9]{6,20}" placeholder="Ej. 1234567890">
  
  
          <label for="saldoInicial">Saldo Inicial</label>
          <input type="number" id="saldoInicial" required min="0" step="0.01" placeholder="Ej. 500000">
  
          <div class="siguiente-container">
            <button type="button" class="nav-btn next-step-btn" aria-label="Siguiente">➡️</button>
          </div>
        </div>
  
        <div class="form-step hidden" id="cuentaStep2">
          <label for="descripcionCuenta">Descripción / Notas</label>
          <textarea id="descripcionCuenta" name="descripcionCuenta" placeholder="Información adicional sobre la cuenta..."></textarea>
  
          <div class="checkbox-options">
            <div class="checkbox-item">
              <label class="checkbox-label" for="cuentaPrincipal">
                Marcar como cuenta principal
                <input type="checkbox" id="cuentaPrincipal">
              </label>
            </div>
          </div>
  
          <div class="botones">
            <button type="submit" id="guardarCuenta">Guardar</button>
            <button type="button" id="cancelarCuenta">Cancelar</button>
            <button type="reset">Limpiar</button>
          </div>
  
          <div class="flecha-container">
            <button type="button" class="nav-btn prev-step-btn" aria-label="Anterior">⬅️</button>
          </div>
        </div>
      </form>
    </div>
  </div>
